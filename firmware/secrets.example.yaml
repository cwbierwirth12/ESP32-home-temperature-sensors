# AI-assisted configuration template; see ../NOTICE.md.
# Copy to secrets.yaml in the same directory. Enter private values only in that copy.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
mqtt_broker: "mqtt.example.com"
# Use your broker account, or empty strings for the temporary anonymous test.
mqtt_username: ""
mqtt_password: ""
fallback_ap_password: "CHANGE_ME_AP_PASSWORD"
ota_password: "CHANGE_ME_OTA_PASSWORD"

# UTC is a neutral example, not the maintainer's timezone.
timezone: "Etc/UTC"
# Replace YOUR_LATITUDE and YOUR_LONGITUDE in your private copy.
# Set timezone= to the same timezone as above; encode / as %2F in the URL.
# Keep the requested fields and units: the display parser depends on them.
weather_url: "http://api.open-meteo.com/v1/forecast?latitude=YOUR_LATITUDE&longitude=YOUR_LONGITUDE&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m&forecast_hours=72&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=Etc%2FUTC&forecast_days=5"
